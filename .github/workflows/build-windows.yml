name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'requirements.txt'
      - '影片逐字稿.bat'
      - 'README.md'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "影片逐字稿" --collect-all faster_whisper --collect-all ctranslate2 --collect-all tokenizers --collect-all opencc app.py

      - name: Make portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item "dist/影片逐字稿.exe" portable/
          if (Test-Path "README.md") { Copy-Item "README.md" portable/ }
          Compress-Archive -Path portable/* -DestinationPath "影片逐字稿-Windows-x64.zip" -Force

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: 影片逐字稿-Windows-x64
          path: 影片逐字稿-Windows-x64.zip
          if-no-files-found: error
